name: Fire Claude Code Routine

on:
  workflow_dispatch:
    inputs:
      message:
        required: false
        default: 'Manual trigger from GitHub Mobile'

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Fire routine
        id: fire
        run: |
          # ボディをファイルに、ステータスコードを変数に分けて取得
          HTTP_STATUS=$(curl -s \
            -o /tmp/routine_response.json \
            -w "%{http_code}" \
            -X POST "${{ secrets.ROUTINE_FIRE_URL }}" \
            -H "Authorization: Bearer ${{ secrets.ROUTINE_TOKEN }}" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d '{"text": "${{ inputs.message }}"}')

          SESSION_URL=$(jq -r '.claude_code_session_url // "N/A"' /tmp/routine_response.json)

          echo "status=$HTTP_STATUS" >> $GITHUB_OUTPUT
          echo "session_url=$SESSION_URL" >> $GITHUB_OUTPUT

          echo "### Result" >> $GITHUB_STEP_SUMMARY
          echo "- HTTP Status: $HTTP_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- Session URL: $SESSION_URL" >> $GITHUB_STEP_SUMMARY

      - name: Check result
        run: |
          STATUS="${{ steps.fire.outputs.status }}"
          SESSION="${{ steps.fire.outputs.session_url }}"

          if [ "$STATUS" != "200" ]; then
            echo "Failed with status: $STATUS"
            exit 1
          fi

          echo "Routine fired successfully"
          echo "Session: $SESSION"
